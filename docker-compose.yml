services:
  mysql:
    image: mysql:8.4
    container_name: trellis-mysql
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=caching_sha2_password
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-trellis_root_pass}
      MYSQL_DATABASE: ${DB_NAME:-trellis}
      MYSQL_USER: ${DB_USER:-trellis_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-trellis_secure_pass}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7.4-alpine
    container_name: trellis-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: trellis-backend
    restart: unless-stopped
    environment:
      - TRELLIS_ENV=development
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=trellis
      - DB_USER=trellis_user
      - DB_PASSWORD=trellis_secure_pass
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      - mysql
      - redis

  celery_worker:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: trellis-celery
    restart: unless-stopped
    command: celery -A app.core.celery_app worker --loglevel=info
    environment:
      - TRELLIS_ENV=development
      - DB_HOST=mysql
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - backend
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: trellis-frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  mysql_data:
  redis_data:
