services:
  mysql:
    image: mysql:8.4
    container_name: trellis-mysql
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    # Security: Database port 3306 is isolated to the internal docker network and not exposed to the host
    networks:
      - trellis-internal
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7.4-alpine
    container_name: trellis-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    # Security: Redis port 6379 is isolated to the internal docker network and not exposed to the host
    networks:
      - trellis-internal
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: trellis-backend
    restart: unless-stopped
    environment:
      - TRELLIS_ENV=${TRELLIS_ENV}
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - FIELD_ENCRYPTION_KEY=${FIELD_ENCRYPTION_KEY}
    ports:
      - "8000:8000"
    networks:
      - trellis-internal
    depends_on:
      - mysql
      - redis

  celery_worker:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: trellis-celery
    restart: unless-stopped
    command: celery -A app.core.celery_app worker --loglevel=info
    environment:
      - TRELLIS_ENV=${TRELLIS_ENV}
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
    networks:
      - trellis-internal
    depends_on:
      - backend
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: trellis-frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    networks:
      - trellis-internal
    depends_on:
      - backend

networks:
  trellis-internal:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
