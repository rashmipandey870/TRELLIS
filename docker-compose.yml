services:
  # Primary Database: PostgreSQL 16 (Local Postgres or overridden by Neon via DATABASE_URL)
  postgres:
    image: postgres:16-alpine
    container_name: trellis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-trellis_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Error: DB_PASSWORD environment variable is required}
      POSTGRES_DB: ${DB_NAME:-trellis}
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - trellis-internal
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-trellis_user} -d ${DB_NAME:-trellis}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    container_name: trellis-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?Error: REDIS_PASSWORD environment variable is required}
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - trellis-internal
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: trellis-ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    networks:
      - trellis-internal
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama-init:
    image: ollama/ollama:latest
    container_name: trellis-ollama-init
    networks:
      - trellis-internal
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["sh", "-c", "ollama pull llama3:8b && ollama pull deepseek-coder:6.7b || true"]
    restart: "no"

  judge0:
    image: judge0/judge0:latest
    container_name: trellis-judge0
    restart: unless-stopped
    privileged: true
    ports:
      - "127.0.0.1:2358:2358"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?Error: REDIS_PASSWORD required}
    networks:
      - trellis-internal
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:2358/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: trellis-backend
    restart: unless-stopped
    command: sh -c "alembic upgrade head && python ../scripts/seed_demo_pack.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      - TRELLIS_ENV=${TRELLIS_ENV:-production}
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://${DB_USER:-trellis_user}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-trellis}}
      - DATABASE_MIGRATION_URL=${DATABASE_MIGRATION_URL:-postgresql+psycopg2://${DB_USER:-trellis_user}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-trellis}}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - SECRET_KEY=${SECRET_KEY:?Error: SECRET_KEY environment variable is required}
      - FIELD_ENCRYPTION_KEY=${FIELD_ENCRYPTION_KEY:?Error: FIELD_ENCRYPTION_KEY environment variable is required}
      - LEDGER_SALT_KEY=${LEDGER_SALT_KEY:?Error: LEDGER_SALT_KEY environment variable is required}
      - AI_API_KEY=${AI_API_KEY:-}
      - CODE_RUNNER=${CODE_RUNNER:-isolated}
      - JUDGE0_URL=${JUDGE0_URL:-http://judge0:2358}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
    ports:
      - "8000:8000"
    volumes:
      - ./secrets:/app/secrets:ro
      - storage_data:/app/storage/uploads
    networks:
      - trellis-internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  celery_worker:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: trellis-celery
    restart: unless-stopped
    command: celery -A app.core.celery_app worker --loglevel=info
    environment:
      - TRELLIS_ENV=${TRELLIS_ENV:-production}
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://${DB_USER:-trellis_user}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-trellis}}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CODE_RUNNER=${CODE_RUNNER:-isolated}
      - JUDGE0_URL=${JUDGE0_URL:-http://judge0:2358}
    networks:
      - trellis-internal
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: trellis-frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    networks:
      - trellis-internal
    depends_on:
      backend:
        condition: service_healthy

networks:
  trellis-internal:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  ollama_data:
  storage_data:
