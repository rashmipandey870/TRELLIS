services:
  # Primary Database: PostgreSQL 16 (Local Postgres or overridden by Neon via DATABASE_URL)
  postgres:
    image: postgres:16-alpine
    container_name: trellis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-trellis_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-CSMTrellis2026!}
      POSTGRES_DB: ${DB_NAME:-trellis}
    ports:
      - "5432:5432"
    networks:
      - trellis-internal
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Alternate Database Option: SQL Server (Enterprise Standard for CSM Technology)
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: trellis-mssql
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD:-CSMTrellis2026!}"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    networks:
      - trellis-internal
    volumes:
      - mssql_data:/var/opt/mssql
    profiles: ["mssql"]

  # Alternate Database Option: MySQL 8.4+
  mysql:
    image: mysql:8.4
    container_name: trellis-mysql
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-CSMTrellis2026!}
      MYSQL_DATABASE: ${DB_NAME:-trellis}
      MYSQL_USER: ${DB_USER:-trellis_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-CSMTrellis2026!}
    ports:
      - "3306:3306"
    networks:
      - trellis-internal
    volumes:
      - mysql_data:/var/lib/mysql
    profiles: ["mysql"]

  redis:
    image: redis:7.4-alpine
    container_name: trellis-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-CSMTrellis2026!}
    ports:
      - "6379:6379"
    networks:
      - trellis-internal
    volumes:
      - redis_data:/data

  ollama:
    image: ollama/ollama:latest
    container_name: trellis-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    networks:
      - trellis-internal
    volumes:
      - ollama_data:/root/.ollama

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: trellis-backend
    restart: unless-stopped
    command: sh -c "alembic upgrade head && python ../scripts/seed_trellis_data.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      - TRELLIS_ENV=${TRELLIS_ENV:-dev}
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://${DB_USER:-trellis_user}:${DB_PASSWORD:-CSMTrellis2026!}@postgres:5432/${DB_NAME:-trellis}}
      - DATABASE_MIGRATION_URL=${DATABASE_MIGRATION_URL:-postgresql+psycopg2://${DB_USER:-trellis_user}:${DB_PASSWORD:-CSMTrellis2026!}@postgres:5432/${DB_NAME:-trellis}}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-CSMTrellis2026!}@redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-trellis-secret-key-salt-2026}
      - FIELD_ENCRYPTION_KEY=${FIELD_ENCRYPTION_KEY:-qW7GZ9X_8K4jL2mN5pQ8rT1vX3zB6dF9hJ0lP2sU4wY=}
      - LEDGER_SALT_KEY=${LEDGER_SALT_KEY:-trellis-ledger-pseudonym-salt-2026}
      - AI_API_KEY=${AI_API_KEY:-}
      - CODE_RUNNER=${CODE_RUNNER:-local}
      - JUDGE0_URL=${JUDGE0_URL:-http://judge0:2358}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
    ports:
      - "8000:8000"
    volumes:
      - ./secrets:/app/secrets:ro
    networks:
      - trellis-internal
    depends_on:
      - postgres
      - redis

  judge0:
    image: judge0/judge0:latest
    container_name: trellis-judge0
    restart: unless-stopped
    ports:
      - "2358:2358"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-CSMTrellis2026!}
    networks:
      - trellis-internal
    depends_on:
      - redis

  celery_worker:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: trellis-celery
    restart: unless-stopped
    command: celery -A app.core.celery_app worker --loglevel=info
    environment:
      - TRELLIS_ENV=${TRELLIS_ENV:-dev}
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://${DB_USER:-trellis_user}:${DB_PASSWORD:-CSMTrellis2026!}@postgres:5432/${DB_NAME:-trellis}}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-CSMTrellis2026!}@redis:6379/0
    networks:
      - trellis-internal
    depends_on:
      - backend
      - redis

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: trellis-frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    networks:
      - trellis-internal
    depends_on:
      - backend

networks:
  trellis-internal:
    driver: bridge

volumes:
  postgres_data:
  mysql_data:
  mssql_data:
  redis_data:
  ollama_data:
