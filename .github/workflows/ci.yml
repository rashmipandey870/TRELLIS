name: TRELLIS CI Quality Gate

on:
  push:
    branches: [master, main, 'slice/**']
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint-and-types:
    name: Backend Lint, Format & Strict Typing
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Tooling Dependencies
        run: |
          python -m pip install --upgrade "pip>=26.2.0"
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run Ruff Lint Checks
        run: ruff check .

      - name: Run Ruff Format Checks
        run: ruff format --check .

      - name: Run Mypy Strict Typing
        run: mypy --strict .

  permission-matrix-verification:
    name: Role-Permission Matrix & Default-Deny Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify Permission Matrix Coverage (100% Default-Deny)
        run: python docs/security/coverage_report.py

      - name: Run Matrix Automated Tests
        run: |
          pip install pytest pytest-asyncio
          pytest backend/tests/test_permission_matrix.py -v

  backend-tests:
    name: Backend Unit, Integration & Immutability Tests (PostgreSQL 16 & Redis)
    needs: [backend-lint-and-types, permission-matrix-verification]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root_ci_test_password
          POSTGRES_DB: trellis_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=5
    defaults:
      run:
        working-directory: backend
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: root_ci_test_password
      TRELLIS_DB_NAME: trellis_db
      TRELLIS_MIGRATOR_PASSWORD: migrator_ci_pass_2026
      TRELLIS_APP_PASSWORD: app_ci_pass_2026
      DATABASE_MIGRATION_URL: postgresql+psycopg2://trellis_migrator:migrator_ci_pass_2026@127.0.0.1:5432/trellis_db
      DATABASE_URL: postgresql+asyncpg://trellis_app:app_ci_pass_2026@127.0.0.1:5432/trellis_db
      REDIS_URL: redis://127.0.0.1:6379/0
      FIELD_ENCRYPTION_KEY: gAAAAABnhX-dummy-fernet-key-32bytes-base64-dev-only=
      TRELLIS_ENV: dev
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade "pip>=26.2.0"
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run Alembic Upgrade to Head (Migration User DDL)
        run: alembic upgrade head

      - name: Configure Dual DB Users & Per-Table Engine Immutability Grants
        run: python ../scripts/init_db_users.py

      - name: Verify Database Grants & ORM Models Reconciliation
        run: python ../scripts/check_db_grants.py

      - name: Run Pytest with Coverage & Immutability Integration Tests
        run: pytest -v --cov=app --cov-report=term-missing --cov-report=xml

      - name: Verify Live Alembic Downgrade & Re-Upgrade Cycle
        run: |
          alembic downgrade base
          alembic upgrade head

  clean-db-migration-seed-and-drift:
    name: Clean DB Migration, Seed & Model Drift Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade "pip>=26.2.0"
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run Alembic Upgrade to Head on Empty Database
        run: |
          DATABASE_URL="sqlite:///ci_clean_test.db" alembic upgrade head

      - name: Seed Database
        run: |
          DATABASE_URL="sqlite:///ci_clean_test.db" python ../scripts/seed_trellis_data.py

      - name: Run Migration & Model Drift Check
        run: |
          pytest tests/test_migrations.py -v

  frontend-build:
    name: Frontend Compilation & DOMPurify Audit Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 24.15 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Pinned Frontend Dependencies
        run: npm ci

      - name: Verify Clean Vulnerability Audit (DOMPurify Override)
        run: |
          # Assert zero critical vulnerabilities
          npm audit --audit-level=critical

      - name: Build Angular Application (Production)
        run: npm run build -- --configuration=production

  accessibility-audit:
    name: Automated Axe-Core WCAG 2.2 AA Accessibility Audit
    needs: frontend-build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 24.15 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers & OS Dependencies
        run: npx playwright install --with-deps chromium

      - name: Build Application for Production Audit
        run: npm run build

      - name: Run Axe-Core Accessibility Check
        run: npm run test:axe
